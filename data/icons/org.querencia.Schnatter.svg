<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">Schnatter</title>
  <desc id="description">Grüne Sprechblase mit abgerundeten Ecken und dunkelgrünem Rand, unten links ein Zipfel, rechts oben ein Auge und ein Schnabel in Querencia-Orange (#F07746), der aus der Blase ragt; in der Blase drei helle Punkte für ein laufendes Gespräch. Kein Logo eines Dienstes (kein Kreis, kein Telefonhörer), flächig.</desc>
  <!-- Schnabel (hinter der Blase, ragt rechts heraus) -->
  <path d="M44 17 L61 23.5 L44 30 Z" fill="#F07746" stroke="#b8532b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M47 23.5 H56" fill="none" stroke="#b8532b" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Sprechblase mit Zipfel -->
  <path d="M15 9 H39 A11 11 0 0 1 50 20 V34 A11 11 0 0 1 39 45 H24 L11 55 L14 44.5 A11 11 0 0 1 4 34 V20 A11 11 0 0 1 15 9 Z" fill="#3f9e5a" stroke="#2b6b3d" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Auge -->
  <circle cx="38" cy="19" r="3.4" fill="#ffffff"/>
  <circle cx="38.8" cy="19" r="1.7" fill="#1f3a28"/>
  <!-- Gespräch -->
  <circle cx="15" cy="32" r="2.6" fill="#d9f0df"/>
  <circle cx="24" cy="32" r="2.6" fill="#d9f0df"/>
  <circle cx="33" cy="32" r="2.6" fill="#d9f0df"/>
</svg>
